<!DOCTYPE html>
<html lang=zh-CN><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>发布 - Honor10</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--muted:#64748b;--blue:#2563eb;--green:#34d399;--amber:#f59e0b;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,'Segoe UI','Microsoft YaHei',sans-serif;padding:16px;max-width:860px;margin:0 auto}
.nav{display:flex;gap:4px;margin-bottom:20px;background:#131c31;border-radius:10px;padding:4px;overflow-x:auto}
.nav a{padding:8px 16px;border-radius:6px;text-decoration:none;color:#94a3b8;font-size:.85rem;white-space:nowrap}
.nav a:hover,.nav a.active{background:var(--blue);color:#fff}
.header{margin-bottom:16px}.header h1{font-size:1.25rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-size:.95rem;margin-bottom:10px;color:#cbd5e1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;font-size:.85rem}
.btn:hover{border-color:#38bdf8;color:#e2e8f0}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:transparent;border-color:var(--red);color:#f87171}
.btn-danger:hover{background:#7f1d1d33}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;border:1px solid var(--line);color:var(--muted)}
.tag.ok{border-color:var(--green);color:var(--green)}
.tag.warn{border-color:var(--amber);color:var(--amber)}
.tag.err{border-color:var(--red);color:#f87171}
.mono{font-family:Consolas,monospace;font-size:.8rem;color:#94a3b8;word-break:break-all}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.mod{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mod .n{font-weight:600;font-size:.9rem}
.mod .v{font-family:Consolas,monospace;font-size:.78rem;color:var(--muted);margin-top:2px}
.rel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rel .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rel .h b{font-family:Consolas,monospace;font-size:.95rem}
.rel .meta{font-size:.75rem;color:var(--muted);margin-top:4px}
.rel .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.audit{font-family:Consolas,monospace;font-size:.72rem;color:#94a3b8;line-height:1.9;max-height:260px;overflow-y:auto}
.audit .ev-apply\:done,.audit .ev-rollback\:done{color:var(--green)}
.audit .ev-apply\:fail,.audit .ev-rollback\:fail{color:#f87171}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
.result{margin-top:10px;padding:10px 12px;border-radius:6px;font-family:Consolas,monospace;font-size:.75rem;white-space:pre-wrap;display:none;border:1px solid var(--line)}
.result.ok{display:block;border-color:var(--green);color:var(--green)}
.result.err{display:block;border-color:var(--red);color:#f87171}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #475569;border-top-color:#e2e8f0;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
input,select{background:#0b1220;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 9px;font-size:.82rem;font-family:Consolas,monospace;min-width:0}
input:focus{outline:none;border-color:#38bdf8}
.cfg{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;gap:10px;flex-wrap:wrap}
.cfg.show{display:flex}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:.72rem;color:#94a3b8}
.cfg label.chk{flex-direction:row;align-items:center;gap:6px;font-size:.8rem}
.cfg .wide{flex:1 1 260px}
.up{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed #233047}
.up:last-child{border-bottom:0}
.up b{font-family:Consolas,monospace;font-size:.88rem}
.up .sj{font-size:.78rem;color:#94a3b8;flex:1 1 240px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .dt{font-size:.72rem;color:var(--muted)}
.up.old{opacity:.55}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:2px;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.25}}
</style>
<script src=config.js></script>
<div class=nav></div>
<div class=header><h1>&#128640; 版本发布</h1></div>

<div class=panel>
  <h2>当前部署</h2>
  <div id=deployed class=mods><span class=empty><span class=spin></span> 加载中…</span></div>
  <div class=row style=margin-top:12px>
    <button class=btn onclick=loadData()>&#8635; 刷新</button>
    <button class="btn btn-danger" onclick=doRollback() id=btnRollback>&#9100; 回滚上一版本</button>
    <span class=mono id=updAt></span>
  </div>
</div>

<div class=panel>
  <h2>上游版本（GitHub）<span id=upBadge></span></h2>
  <div class=row id=upSummary><span class=empty><span class=spin></span> 检测中…</span></div>
  <div id=upList style=margin-top:8px></div>
  <div class=row style=margin-top:12px>
    <button class="btn btn-primary" id=btnUpdLatest onclick=updateLatest()>&#128640; 一键更新到最新</button>
    <button class=btn id=btnUpCheck onclick=checkUp()>&#8635; 立即检测</button>
    <button class=btn onclick=toggleCfg()>&#9881; 检测设置</button>
    <span class=mono id=upAt></span>
  </div>
  <div class=cfg id=upCfg>
    <label class=wide>仓库（owner/name）<input id=cfgRepo placeholder=lehuaner/SSHMonitor></label>
    <label class=wide>只读 Token（私有仓库必填）<input id=cfgToken type=password placeholder="留空则不修改；fine-grained PAT → Contents: Read-only"></label>
    <label>检测间隔（分）<input id=cfgInterval type=number min=5 max=1440 style=width:96px></label>
    <label class=wide>tag 匹配规则<input id=cfgPattern style=width:200px></label>
    <label class=chk><input id=cfgEnabled type=checkbox> 启用自动检测</label>
    <div class=row style=margin-top:6px;width:100%>
      <button class="btn btn-primary" onclick=saveCfg()>&#128190; 保存并检测</button>
      <button class=btn onclick=clearToken()>清除 Token</button>
      <span class=mono id=cfgHint></span>
    </div>
  </div>
</div>

<div class=panel>
  <h2>已 staging 的 Release（tag 自动落盘，待应用）</h2>
  <div id=releases></div>
</div>

<div class=panel>
  <h2>发布审计（最近事件）</h2>
  <div id=audit class=audit><span class=empty>加载中…</span></div>
</div>

<div class="result" id=result></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtT(ts){return ts?new Date(ts).toLocaleString('zh-CN',{hour12:false}):'—'}
function show(res,ok){const el=$('#result');el.className='result '+(ok?'ok':'err');el.textContent=typeof res==='string'?res:JSON.stringify(res,null,2)}
async function api(u,opt){try{const r=await fetch(u,opt);return await r.json()}catch(e){return{ok:false,error:e.message}}}
// ====== 分页（上游版本列表 / release 列表共用） ======
const PAGE_SIZE=8; let UP_PAGE=0, REL_PAGE=0, REL=[], RELMODS={};
function pageSlice(arr,size,page){const s=page*size;return arr.slice(s,s+size);}
function pagerHtml(total,size,page,fn){
  if(total<=size) return '';
  const pages=Math.ceil(total/size);
  return `<div class=row style=margin-top:8px;justify-content:center;gap:8px>`
    +`<button class=btn ${page<=0?'disabled':''} onclick="${fn}(${page-1})">&laquo; 上一页</button>`
    +`<span class=mono>第 ${page+1} / ${pages} 页（共 ${total}）</span>`
    +`<button class=btn ${page>=pages-1?'disabled':''} onclick="${fn}(${page+1})">下一页 &raquo;</button></div>`;
}

async function loadData(){
  const r=await api('/api/release/status');
  if(!r.ok){$('#deployed').innerHTML='<span class=empty>加载失败: '+esc(r.error||'')+'</span>';return}
  // 当前部署（各模块版本）
  const mods=Object.entries(r.deployed.modules||{});
  $('#deployed').innerHTML=mods.length
    ? mods.map(([m,v])=>`<div class=mod><div class=n>${esc(m)}</div><div class=v>${esc(v.tag)}<br>${esc((v.sha||'').slice(0,7))}</div></div>`).join('')
    : '<span class=empty>尚未记录部署版本（首次 apply 后显示）</span>';
  const la=r.deployed.lastApply;
  $('#updAt').textContent=la?('上次操作: '+la.tag+' @ '+fmtT(la.at)):'';
  $('#btnRollback').disabled=!r.releases.length;
  // 待应用 releases（分页渲染）
  REL=r.releases||[]; RELMODS=r.deployed.modules||{};
  renderReleases();
}
function renderReleases(){
  const box=$('#releases');
  if(!REL.length){box.innerHTML='<div class=empty>暂无本地 release。上游新 tag 可在上方直接「一键更新到最新 / 拉取并应用」（手机端自 GitHub 自拉）。</div>';return}
  if(REL_PAGE*PAGE_SIZE>=REL.length) REL_PAGE=0;
  const modKeys=Object.keys(RELMODS||{});
  const items=pageSlice(REL,PAGE_SIZE,REL_PAGE).map(x=>{
    const applied=modKeys.filter(m=>RELMODS[m]&&RELMODS[m].tag===x.tag);
    const isApplied=applied.length===modKeys.length&&applied.length>0;
    return `<div class=rel>
      <div class=h><b>${esc(x.tag)}</b>
        <span class="tag ${isApplied?'ok':'warn'}">${isApplied?'已部署':'待应用'}</span>
        <span class=tag>${x.fileCount} 文件</span>
        <span class=tag>影响: ${esc((x.affectedModules||[]).join(', ')||'—')}</span>
      </div>
      <div class=meta>sha ${esc((x.sha||'').slice(0,7))} · staged ${fmtT(x.stagedAt)}</div>
      <div class=acts>
        <button class="btn btn-primary" onclick=doApply('${esc(x.tag)}')>&#9654; 应用此版本</button>
      </div>
    </div>`;
  }).join('');
  box.innerHTML=items+pagerHtml(REL.length,PAGE_SIZE,REL_PAGE,'goRel');
}
function goRel(n){REL_PAGE=Math.max(0,n);renderReleases();}

// 202 异步任务：发起后轮询 /api/release/tasks?id= 直到 done/failed
// 轮询容忍 gateway 重启窗口的 502/网络错误（重试至总超时 120s）
let pollAbort = false;
async function pollTask(taskId, totalMs = 120000){
  const t0 = Date.now();
  let lastSteps = 0;
  while (Date.now() - t0 < totalMs && !pollAbort) {
    await new Promise(r=>setTimeout(r,1500));
    let st = null;
    try { st = await api('/api/release/tasks?id='+taskId); } catch { st = null; }
    if (!st || !st.ok) { show('轮询中…（网关重启窗口，继续等待）', true); continue; }
    const t = st.task;
    const lines = (t.steps||[]).map(s=>'· '+s.msg).join('\n');
    show(`[${t.state}] ${t.kind === 'apply' ? '应用 '+(t.tag||'') : '回滚'+(t.rollbackTo?' → '+t.rollbackTo:'')}\n${lines}${t.error?('\n错误: '+t.error):''}`, t.state==='running');
    if (t.state !== 'running') return t;
    lastSteps = (t.steps||[]).length;
  }
  throw new Error('轮询超时（120s），任务可能仍在进行，请稍后刷新查看');
}

async function doApply(tag){
  if(!confirm(`应用 ${tag}？\n若手机本地无该版本档案，会先从 GitHub 按 manifest 自拉文件，再复制并重启受影响模块。`))return;
  pollAbort = false;
  const r=await api('/api/release/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag})});
  if(!r.ok){ show(r, false); return; }
  try {
    const t = await pollTask(r.taskId);
    show(t, t.state==='done');
    loadData();
  } catch(e){ show({ok:false,error:e.message}, false); loadData(); }
}

async function doRollback(){
  if(!confirm('回滚到上一 release？\n将恢复其全部文件并重启相关模块。'))return;
  pollAbort = false;
  const r=await api('/api/release/rollback',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  if(!r.ok){ show(r, false); return; }
  try {
    const t = await pollTask(r.taskId);
    show(t, t.state==='done');
    loadData();
  } catch(e){ show({ok:false,error:e.message}, false); loadData(); }
}

async function loadAudit(){
  const r=await api('/api/release/audit');
  const el=$('#audit');
  if(!r.ok){el.textContent='加载失败: '+(r.error||'');return}
  el.innerHTML=(r.events||[]).map(e=>{
    const t=new Date(e.ts).toLocaleString('zh-CN',{hour12:false});
    const {ts,...rest}=e;
    return `<div class="ev-${esc(e.event).replace(':','\\:')}">${t}  ${esc(e.event)}  ${esc(JSON.stringify(rest))}</div>`;
  }).join('')||'<div class=empty>暂无事件</div>';
}

// ====== 上游版本检测（手机端自己拉 GitHub，Windows 侧只负责发布） ======
let UP=null;
const STATE={
  'new-staged':['ok','可应用','文件已在手机上，直接点应用'],
  'new-unstaged':['warn','可拉取并应用','手机按 manifest 从 GitHub 自拉后应用（无需 PC staging）'],
  deployed:['ok','当前'],
  old:['','旧版本'],
};
async function loadUpstream(){
  const r=await api('/api/release/upstream');
  if(!r.ok){$('#upSummary').innerHTML='<span class="tag err">加载失败</span> <span class=mono>'+esc(r.error||'')+'</span>';return}
  UP=r; renderUp();
}
function renderUp(){
  const r=UP, S=$('#upSummary'), L=$('#upList');
  $('#upAt').textContent=r.checkedAt?('上次检测: '+fmtT(r.checkedAt)):'尚未检测';
  const behind=r.behindCount||0;
  $('#upBadge').innerHTML=behind?`<span class="tag warn" style=margin-left:6px>+${behind} 个新版本<span class=dot></span></span>`:(r.latest?`<span class="tag ok" style=margin-left:6px>已最新</span>`:'');
  document.title=behind?`(${behind} 待更新) 发布 - Honor10`:'发布 - Honor10';
  if(r.never&&!r.items.length){S.innerHTML='<span class=empty>尚未检测过。点下方「立即检测」（私有仓库需先在「检测设置」里填只读 token）。</span>';L.innerHTML='';return}
  const chips=[`<span class=tag>已部署 ${esc(r.base)}</span>`,r.latest?`<span class=tag>上游最新 ${esc(r.latest)}</span>`:''];
  if(behind) chips.push(`<span class="tag warn">落后 ${behind} 个，可直接「拉取并应用」（自 GitHub）</span>`);
  else if(r.latest) chips.push('<span class="tag ok">已是最新</span>');
  let err='';
  if(r.checkError) err=`<div class="tag err" style=margin-top:6px>检测失败：${esc(r.checkError)}</div>`;
  S.innerHTML=chips.join('')+(r.tokenSet?'':'<span class=tag style=margin-left:6px>无 token（仅公开仓库可检）</span>')+err;
  if(!r.items.length){L.innerHTML='<div class=empty>无 tag 数据</div>';return}
  if(UP_PAGE*PAGE_SIZE>=r.items.length) UP_PAGE=0;
  const rows=pageSlice(r.items,PAGE_SIZE,UP_PAGE).map(x=>{
    const [cls,txt,hint]=STATE[x.state]||STATE.old;
    let btn='';
    if(x.state==='new-staged') btn=`<button class="btn btn-primary" style=padding:4px 10px onclick="doApply('${esc(x.tag)}')">&#9654; 应用</button>`;
    else if(x.state==='new-unstaged') btn=`<button class="btn btn-primary" style=padding:4px 10px onclick="doApply('${esc(x.tag)}')">&#8681; 拉取并应用</button>`;
    return `<div class="up ${x.newer?'':'old'}">
      <b>${esc(x.tag)}</b><span class="tag ${cls}">${txt}</span>
      <span class=sj title="${esc(hint||'')} · ${esc(x.subject||'')}">${esc(x.subject||hint||'')}</span>
      <span class=dt>${esc((x.date||'').slice(0,10))}</span>
      <span class=mono>${esc((x.sha||'').slice(0,7))}</span>${btn}
    </div>`;
  }).join('');
  L.innerHTML=rows+pagerHtml(r.items.length,PAGE_SIZE,UP_PAGE,'goUp');
}
function goUp(n){UP_PAGE=Math.max(0,n);renderUp();}

// 一键更新到上游最新版本（后端 apply 前先整份备份 ~/.monitor_data）
async function updateLatest(){
  const latest=UP&&UP.latest;
  if(!latest){show('尚不知最新版本，请先点「立即检测」', false);return}
  if(!confirm(`一键更新到最新 ${latest}？\n· 应用前会先整份备份 ~/.monitor_data（含签到账号等配置）\n· 手机本地无档案则从 GitHub 自拉\n· 复制→重启→健康验证，失败自动回滚`))return;
  pollAbort=false;
  const r=await api('/api/release/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag:latest})});
  if(!r.ok){show(r,false);return}
  try{const t=await pollTask(r.taskId);show(t,t.state==='done');loadData();await checkUp();}catch(e){show({ok:false,error:e.message},false);loadData();}
}
async function checkUp(){
  const b=$('#btnUpCheck'); b.disabled=true; b.innerHTML='<span class=spin></span> 检测中…';
  const r=await api('/api/release/upstream/check',{method:'POST'});
  b.disabled=false; b.innerHTML='&#8635; 立即检测';
  if(!r.ok&&r.error){show(r,false);return}
  if(r.items){UP=r;renderUp();}
  show(`检测完成：${(r.items||[]).length} 个 tag，上游最新 ${r.latest||'—'}，落后 ${r.behindCount||0}`, !r.checkError);
}
function toggleCfg(){const el=$('#upCfg');el.classList.toggle('show');if(el.classList.contains('show')&&!el.dataset.loaded)loadCfg()}
async function loadCfg(){
  const r=await api('/api/release/config');
  if(!r.ok){$('#cfgHint').textContent='配置加载失败: '+(r.error||'');return}
  const u=r.upstream;
  $('#cfgRepo').value=u.repo||''; $('#cfgInterval').value=u.intervalMin||30;
  $('#cfgPattern').value=u.tagPattern||''; $('#cfgEnabled').checked=!!u.enabled;
  $('#cfgToken').placeholder=u.tokenSet?`已设置（${u.token}），留空则不修改`:'留空则不修改；fine-grained PAT → Contents: Read-only';
  $('#cfgHint').textContent=u.tokenSet?'token 已设置（响应只回传脱敏值）':'未设置 token';
  $('#upCfg').dataset.loaded='1';
}
async function saveCfg(){
  const body={repo:$('#cfgRepo').value.trim(),intervalMin:Number($('#cfgInterval').value)||30,
    tagPattern:$('#cfgPattern').value.trim(),enabled:$('#cfgEnabled').checked};
  const tk=$('#cfgToken').value.trim(); if(tk)body.token=tk;
  const r=await api('/api/release/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){$('#cfgHint').textContent='保存失败: '+(r.error||'');show(r,false);return}
  $('#cfgToken').value=''; $('#cfgHint').textContent='已保存，正在检测…';
  await checkUp(); await loadCfg(); loadData();
}
async function clearToken(){
  if(!confirm('清除手机端保存的 GitHub token？之后私有仓库将无法检测。'))return;
  const r=await api('/api/release/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'',clearToken:true})});
  $('#cfgHint').textContent=r.ok?'token 已清除':'清除失败: '+(r.error||'');
  $('#cfgToken').value=''; await checkUp(); await loadCfg();
}

loadData();loadAudit();loadUpstream();
setInterval(loadAudit,30000);
setInterval(loadUpstream,60000);
</script>
