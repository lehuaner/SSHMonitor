<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link rel=stylesheet href="site.css">
<style>
/* 布局/导航/常用组件见 site.css；以下为本页专有样式 */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{font-size:1.4rem;font-weight:600;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#131c31;border:1px solid #1e293b;border-radius:12px;padding:16px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.card-h label{font-size:.65rem;text-transform:uppercase;color:#64748b;letter-spacing:.5px;font-weight:500}
.btn{padding:6px 16px;border-radius:6px;border:none;font-size:.8rem;cursor:pointer;color:#fff;transition:opacity .2s;background:#1e293b;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{opacity:.8}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:#2563eb}.btn-warn{background:#d97706}.btn-rst{background:#059669}.btn-danger{background:#dc2626}
.btn-sm{padding:4px 10px;font-size:.75rem}
input,select,textarea{background:#0b1120;border:1px solid #334155;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-size:.85rem;outline:none;width:100%;font-family:inherit}
input:focus,select:focus{border-color:#38bdf8}
.form-row{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.form-row .field-hint{grid-column:2;font-size:.68rem;color:#64748b;line-height:1.4;margin-top:-4px}
.form-row label{font-size:.75rem;color:#94a3b8}
.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;cursor:pointer;inset:0;background:#1e293b;border-radius:24px;transition:.3s}
.toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#94a3b8;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:#2563eb}
.toggle input:checked+.slider:before{transform:translateX(20px);background:#fff}
.toggle-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.empty{text-align:center;color:#64748b;padding:20px;font-size:.8rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;padding:10px 24px;border-radius:8px;font-size:.8rem;z-index:99;transition:opacity .3s;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.loading{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:.75rem;color:#64748b;margin-top:8px;min-height:1em}
.status.ok{color:#22c55e}.status.err{color:#ef4444}
.task{background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-bottom:10px}
.task-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.task-name{font-size:.9rem;font-weight:600;color:#e2e8f0;flex:1;min-width:120px}
.tag{font-size:.65rem;padding:2px 8px;border-radius:4px;background:#1e293b;color:#94a3b8;white-space:nowrap}
.tag:has(.prov-ico){padding:3px 6px;display:inline-flex;align-items:center}
.prov-ico{width:15px;height:15px;display:block;border-radius:3px}
/* —— 定长对齐：徽章/数值/详情项统一宽度，多卡片之间不跳动 —— */
.task-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-st{min-width:5.4em;text-align:center}
.tag-today{min-width:6.2em;text-align:center}
.tag-en{min-width:4.6em;text-align:center}
.tag-total b{display:inline-block;min-width:5.4em;text-align:right;font-variant-numeric:tabular-nums}
.task-meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px}
.task-meta>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task-meta b,.task-meta .num{font-variant-numeric:tabular-nums}
.task-actions .btn-sm{min-width:7em;justify-content:center}
/* Cookie 到期定长：天数栏/日期栏各自定宽 + 等宽数字，跨卡片完全对齐 */
.ck-left{display:inline-block;min-width:4.6em;font-variant-numeric:tabular-nums}
.ck-date{display:inline-block;min-width:7.4em;font-variant-numeric:tabular-nums}
/* 编辑弹窗内的「平台功能」区（设备验证/验证码登录/权益包） */
.modal-caps{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.modal-caps:empty{display:none}
.modal-caps>label{width:100%;font-size:.7rem;color:#64748b}
.modal-caps .btn-sm{min-width:7em;justify-content:center}
.tag.ok{background:rgba(34,197,94,.15);color:#22c55e}
.tag.err{background:rgba(239,68,68,.15);color:#ef4444}
.tag.warn{background:rgba(217,119,6,.15);color:#f59e0b}
.tag.purple{background:rgba(167,139,250,.15);color:#a78bfa}
.task-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.72rem;color:#64748b}
.task-meta b{color:#e2e8f0;font-family:monospace;font-weight:600}
.task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.log-block{display:none;margin-top:10px;border-top:1px solid #1e293b;padding-top:8px}
.log-block.show{display:block}
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-top:6px}
.log-day{height:34px;border-radius:6px;background:#1e293b;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.55rem;color:#64748b;cursor:default}
.log-day.ok{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 0 6px rgba(16,185,129,.45);border:1px solid #34d399}
.log-day.fail{background:rgba(239,68,68,.18);color:#ef4444}
.log-day.invalid{background:rgba(217,119,6,.18);color:#f59e0b}
.log-day.skip{background:#1e293b;color:#475569}
/* 远端签到记录（平台侧历史）：本机未跑过，但平台确认当天签过 → 与「本机成功」用不同色区分 */
.log-day.remote{background:linear-gradient(135deg,#0369a1,#0ea5e9);color:#fff;border:1px solid #38bdf8;box-shadow:0 0 6px rgba(14,165,233,.35)}
.log-day .d{font-size:.6rem;font-weight:600}
.log-day .v{font-size:.5rem}
.log-day.ok .v{font-weight:800;font-size:.62rem}
.usage-block{display:none;margin-top:10px;border-top:1px solid #1e293b;padding-top:8px}
.usage-block.show{display:block}
.usage-summ{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:.78rem;color:#94a3b8}
.usage-summ b{color:#f59e0b;font-family:monospace}
.usage-row{display:flex;gap:10px;padding:6px 8px;border-bottom:1px solid #16203a;align-items:flex-start;font-size:.75rem}
.usage-row .um{color:#38bdf8;white-space:nowrap;font-weight:600;min-width:70px}
.usage-row .ut{color:#64748b;white-space:nowrap;font-variant-numeric:tabular-nums}
.usage-row .uc{color:#f59e0b;white-space:nowrap;font-family:monospace}
.usage-row .up{color:#94a3b8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.usage-row .usk{color:#475569;white-space:nowrap;font-size:.68rem}
.usage-empty{color:#64748b;font-size:.75rem;padding:8px 0}
.usage-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.usage-bar input[type=date]{width:auto;background:#0b1120;border:1px solid #334155;border-radius:6px;padding:4px 8px;color:#e2e8f0;font-size:.75rem;outline:none}
.usage-bar input[type=date]:focus{border-color:#38bdf8}
.chart-box{position:relative;height:300px;margin-bottom:8px}
.chart-box canvas{position:absolute;inset:0}
.cal-wrap{overflow-x:auto;}
.cal{display:grid;grid-auto-flow:column;grid-auto-columns:auto;gap:4px;width:max-content;margin-top:6px}
.cal-col{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.cal-day{width:26px;height:26px;border-radius:4px;background:#0b1120;border:1px solid #1e293b;display:flex;align-items:center;justify-content:center;font-size:.55rem;color:#475569;cursor:default;position:relative}
.cal-day .cv{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;border-radius:4px;padding:3px 6px;font-size:.6rem;color:#e2e8f0;white-space:nowrap;z-index:10}
.cal-day:hover .cv{display:block}
.cal-day.zero{background:#0b1120;color:#334155}
.cal-dow{font-size:.5rem;color:#475569;text-align:center;height:14px}
.cal-legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:6px;font-size:.6rem;color:#64748b}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.modal{background:#131c31;border:1px solid #1e293b;border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-h label{font-size:.85rem;color:#e2e8f0;font-weight:600;text-transform:none}
.modal-close{cursor:pointer;color:#64748b;font-size:1rem;padding:0 4px}
.modal-close:hover{color:#ef4444}
.field-toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.field-toggle label{font-size:.75rem;color:#94a3b8}
/* 配置分组折叠（如「积分过期提醒」）：schema 里带 group 的字段会被收进同一个 details */
.cfg-group{border:1px solid #1e293b;border-radius:8px;margin:10px 0;background:#0f172a}
.cfg-group>summary{cursor:pointer;list-style:none;padding:9px 12px;font-size:.78rem;font-weight:600;color:#cbd5e1;display:flex;align-items:center;gap:6px}
.cfg-group>summary::-webkit-details-marker{display:none}
.cfg-group>summary::before{content:"▸";color:#64748b;transition:transform .15s}
.cfg-group[open]>summary::before{content:"▾"}
.cfg-group>summary:hover{color:#e2e8f0}
.cfg-group-body{padding:2px 12px 10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr;gap:4px}}
</style>

<script>
var $=s=>document.querySelector(s);
var providers=[], tasks=[], stats=null, editingId=null;

function toast(msg){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function status(msg,type){const s=$('#status');s.textContent=msg;s.className='status'+(type?' '+type:'');}

async function api(url,opts){
  try{
    const r=await fetch(url,opts);
    return await r.json().catch(()=>({ok:false,error:'响应异常 HTTP '+r.status}));
  }catch(e){
    return {ok:false,error:'网络/网关错误: '+(e.message||e)};
  }
}
function fmtTime(ts){if(!ts)return '—';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function cookieLeftTxt(ts){
  const d=Math.ceil((ts-Date.now())/86400000);
  const dt=new Date(ts),p=n=>String(n).padStart(2,'0');
  const s=`${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
  if(d<=0)return `<b class=ck-left style="color:#ef4444">已到期</b><b class=ck-date>(${s})</b>`;
  const c=d<=3?'#f59e0b':'#34d399';
  return `<b class="ck-left" style="color:${c}">剩 ${d>99?'99+':p(d)} 天</b><b class=ck-date>(${s})</b>`;
}
function fmtDate(date){const [,m,d]=date.split('-');return `${m}/${d}`;}
// 凭证到期展示：阶梯完全由 provider 的 credDisplay 声明（schema 驱动）。
// ★ 口径 = 「维护链终点」：到了显示的那个日子自动续期链彻底断掉、再也签不了。
//   所以只有两类值能上卡片：
//     1) 有确定到期日的人工腿（Trae refreshToken / AutoClaw refresh_token / WorkBuddy web 模式 Cookie）；
//     2) 人工腿没有确定到期日时（WorkBuddy 的 Cookie 只能靠探活、OfficeAce 靠账号密码重登），
//        取「最后一次自动续期成功后的派生凭证到期」（换票成功即 +60 天，会滚动）。
//   反之：短命且每次签到都会重签的派生腿（如 OfficeAce 的 2h AKSK）不能上卡片，那只会常驻「已到期」。
// ★ 以前这里把 Trae 的「方案一 / 方案二」硬编码成全局逻辑，凡是带 refreshToken 的平台
//   （AutoClaw / OfficeAce）都会被叫成「方案一凭证」、Tooltip 里写着 Trae 的 180 天与
//   Trae CN 客户端。现按各 provider 自己的凭证口径渲染，无声明则走通用默认。
function credLeftHtml(t){
  const p=providers.find(x=>x.id===t.providerId);
  const ladder=(p&&p.credDisplay&&p.credDisplay.ladder)||null;
  const cfg=t.config||{};
  const truthy=v=>v!==undefined&&v!==null&&v!==''&&(!Array.isArray(v)||v.length>0);
  // 条件求值：单个或 'A && B'；hasCookie / hasToken / hasRefreshToken / noCookie / noRefreshToken
  // / authMode=web（config 字段等值）/ 裸字段名（按 config 有值判定）
  const one=c=>{
    c=String(c).trim();
    if(c==='hasCookie')return !!t.hasCookie;
    if(c==='hasToken')return !!t.hasToken;
    if(c==='hasRefreshToken')return !!t.hasRefreshToken;
    if(c==='noCookie')return !t.hasCookie;
    if(c==='noRefreshToken')return !t.hasRefreshToken;
    const m=/^(\w+)=([\w-]+)$/.exec(c);
    if(m)return String(cfg[m[1]])===m[2];
    if(c in cfg)return truthy(cfg[c]);
    return true;
  };
  const ok=c=>!c||String(c).split('&&').every(one);
  const field=v=>v==='cookieExpiresAt'?t.cookieExpiresAt
    :v==='refreshTokenExpiredAt'?t.refreshTokenExpiredAt
    :v==='tokenExpiredAt'?t.tokenExpiredAt
    :v==='config.refreshTokenExpiresAt'?cfg.refreshTokenExpiresAt
    :v==='config.tokenExpiresAt'?cfg.tokenExpiresAt:null;
  const pick=fs=>{for(const f of (fs||[])){const v=Number(field(f));if(v)return v;}return null;};
  const steps=ladder&&ladder.length?ladder:[
    // 通用默认：不提及「方案」，只按 refreshToken / Cookie / Token 三条腿
    {label:'凭证',fields:['refreshTokenExpiredAt','config.refreshTokenExpiresAt'],if:'hasRefreshToken'},
    {label:'Cookie',fields:['cookieExpiresAt'],if:'hasCookie'},
    {label:'Token',fields:['tokenExpiredAt','config.tokenExpiresAt'],if:'hasToken'},
  ];
  for(const s of steps){
    if(!ok(s.if))continue;
    // 后端巡检会把同一个维护链终点落到 task.maintenanceExpiresAt（lib/credential-expiry.js），
    // 阶梯取不到时兜它的值，保证卡片与邮件/日报不会两个口径。
    const exp=pick(s.fields)||t.maintenanceExpiresAt||null;
    let ti=s.title||(s.label+' 到期时间未探测（以探活结果为准）');
    // 附加腿（如 Trae 方案一旁边的兜底 Cookie）：不进正文，只追到 tooltip 尾部，
    // 避免「主腿还长、兜底已废」这种只在真要降级时才致命的状态被隐掉。
    if(s.also){
      const a=Number(pick(s.also.fields)||0);
      if(a)ti+='；'+s.also.label+(a>Date.now()?' 到 '+cookieLeftTxt(a).replace(/<[^>]+>/g,''):' 已到期');
    }
    return `<span title="${esc(ti)}">${esc(s.label)} ${exp?cookieLeftTxt(exp):'<b>—</b>'}</span>`;
  }
  return '<span>凭证 <b>—</b></span>';
}

async function loadData(){
  status('加载中…','');$('#status').innerHTML='<span class=loading></span> 加载中…';
  const pfSel=$('#providerFilter');const pf=pfSel?pfSel.value:'';
  const [p,t,s]=await Promise.all([api('/api/checkin/providers'),api('/api/checkin/tasks'+(pf?'?provider='+encodeURIComponent(pf):'')),api('/api/checkin/stats')]);
  providers=p.providers||[];
  // 平台筛选下拉：每次刷新重建（含账号数角标），保留用户已选值
  if(pfSel){
    const cur=pfSel.value;
    pfSel.innerHTML='<option value="">全部平台</option>'+providers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}${x.accountCount?` (${x.accountCount})`:''}</option>`).join('');
    pfSel.value=[...pfSel.options].some(o=>o.value===cur)?cur:'';
  }
  tasks=t.tasks||[];
  if(s.accounts)stats=s;
  else if(s.pending||s.refreshing)schedulePollStats();
  render();
  renderStats();
  updateChartsBtn();
  const filteredNote=pf&&t.total!==undefined?`（筛选 ${t.filtered}/${t.total}）`:'';
  status(`已加载 ${tasks.length} 个账号${filteredNote}`,'ok');
  autoCheck();
}
// ====== stats 快照后台构建轮询 ======
// 后端 GET /stats 已改为只读快照（pending=首次构建中，refreshing=后台重算中）；
// 命中时延迟 10s 重取，最多 3 次，取到完整快照后增量刷新面板。
var statsPollTimer=null;
function schedulePollStats(left){
  left=(left===undefined)?3:left;
  if(left<=0||statsPollTimer)return;
  statsPollTimer=setTimeout(async function(){
    statsPollTimer=null;
    const s=await api('/api/checkin/stats');
    if(s.accounts){stats=s;renderStats();updateChartsBtn();}
    if(s.pending||s.refreshing)schedulePollStats(left-1);
  },10000);
}
// 手动刷新：触发后台重算（不阻塞）+ 立即用现有快照渲染，稍后轮询取最新
function manualRefresh(){
  api('/api/checkin/stats/refresh',{method:'POST'});
  schedulePollStats(4);
  loadData();
}

function renderFields(task){
  const p=providers.find(x=>x.id===$('#f_provider').value);
  const box=$('#f_fields');box.innerHTML='';
  syncNamePlaceholder();
  if(!p)return;
  // 带 group 的连续字段收进同一个可折叠区块（如「积分过期提醒」），其余照旧平铺。
  // ★保持原有顺序：分组出现在该组第一个字段所在的位置。
  const groups=[];let curGroup=null;
  for(const f of p.configSchema||[]){
    if(f.group){
      if(!curGroup||curGroup.title!==f.group){curGroup={title:f.group,items:[]};groups.push(curGroup);}
      curGroup.items.push(f);
    }else{curGroup=null;groups.push({title:null,items:[f]});}
  }
  for(const g of groups){
    const html=g.items.map(f=>fieldHtml(f,task)).join('');
    // 默认折叠：不带 open 属性
    if(g.title)box.insertAdjacentHTML('beforeend',`<details class=cfg-group><summary>${esc(g.title)}</summary><div class=cfg-group-body>${html}</div></details>`);
    else box.insertAdjacentHTML('beforeend',html);
  }
}
// 单个字段的 HTML（从 renderFields 里抽出，供分组/平铺两种布局复用）
function fieldHtml(f,task){
  // 取值：编辑时用已存值，否则用 schema 默认值（新增时也要回填默认）
  const cur=task?(task.config[f.key]??f.default):(f.default);
  // 纯展示型字段：不参与取值/提交（无 data-k，collectFields 会自然跳过）
  if(f.type==='download'){
    const href=f.href||'#';
    return `<div class=form-row><label>${esc(f.label)}</label>
        <div style="grid-column:2">
          <button class="btn btn-primary" type=button onclick="downloadScript('${esc(href)}',this)">${esc(f.text||'下载')}</button>
          <a href="${esc(href)}" download style="margin-left:10px;font-size:.72rem;color:#64748b">直接下载</a>
          ${f.hint?`<div class=field-hint>${esc(f.hint)}</div>`:''}
        </div></div>`;
  }
  if(f.type==='toggle'){
    const tv=cur===undefined?false:cur;
    return `<div class=field-toggle><label>${esc(f.label)}</label><label class=toggle><input type=checkbox data-k="${f.key}" ${tv?'checked':''}><span class=slider></span></label></div>`;
  }
  if(f.type==='select'){
    const opts=f.options||[];
    const isCustom=cur!==undefined&&!opts.some(o=>String(o.value)===String(cur));
    const optHtml=opts.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(cur)?'selected':''}>${esc(o.label)}</option>`).join('');
    const customSel=isCustom?' selected':'';
    const customIn=isCustom?`<input type="text" data-k="${f.key}_custom" placeholder="自定义值" value="${esc(cur)}">`:'';
    return `<div class=form-row><label>${esc(f.label)}${f.required?' *':''}</label>
        <select data-k="${f.key}" onchange=onSelectChange(this)>${optHtml}<option value="__custom__"${customSel}>自定义…</option></select>
        <span data-custom="${f.key}" style="grid-column:2">${customIn}</span>
      </div>`;
  }
  const isPwd=f.type==='password';
  const oldVal=isPwd&&task?(task.config[f.key]??''):'';
  const ph=isPwd&&task?'留空则不修改（当前已掩码）':(f.placeholder||'');
  let val='';
  if(isPwd&&task&&oldVal){ val=maskToken(oldVal); }
  else if(!isPwd){ val=(cur===undefined?'':cur); }
  const hintTxt=f.hint?`<div class=field-hint>${esc(f.hint)}</div>`:'';
  return `<div class=form-row><label>${esc(f.label)}${f.required?' *':''}</label><input type="${f.type||'text'}" data-k="${f.key}" value="${esc(val)}" placeholder="${esc(ph)}">${hintTxt}</div>`;
}
// 下载「凭证提取脚本」，并在下载那一刻把本面板地址注入脚本。
// 脚本外壳里有一行 `set "TRAE_API_BASE=__API_BASE__"`，这里替换成 location.origin，
// 于是脚本能直接写回本服务端 —— 全链路不硬编码任何域名（换域名/本地部署都自动正确）。
async function downloadScript(path,btn){
  const old=btn?btn.textContent:'';
  try{
    if(btn){btn.disabled=true;btn.textContent='准备中…';}
    const r=await fetch(path,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    let txt=await r.text();
    txt=txt.split('__API_BASE__').join(location.origin);
    const name=path.split('/').pop()||'script.bat';
    const url=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));
    const a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('已下载，脚本已带上本面板地址');
  }catch(e){
    toast('下载失败：'+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent=old;}
  }
}

// 解析导入串（前端只做结构解析用于预览，真正的校验在服务端）
function parseImport(s){
  s=String(s||'').trim();
  if(s.indexOf('TRAE1.')!==0) return null;
  try{
    let b=s.slice(6).replace(/-/g,'+').replace(/_/g,'/');
    while(b.length%4) b+='=';
    const bin=atob(b);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const j=JSON.parse(new TextDecoder().decode(bytes));
    return (j&&j.rt)?j:null;
  }catch(e){ return null; }
}

// 允许脚本用 #trae=<导入串> 把浏览器叫起来并预填（hash 不发给服务器）
(function(){

  if(!m) return;
  try{

function collectFields(){
  const p=providers.find(x=>x.id===$('#f_provider').value);
  const cfg={};
  if(!p)return cfg;
  for(const f of p.configSchema||[]){
    const el=$(`#f_fields [data-k="${f.key}"]`);
    if(!el)continue;
    if(f.type==='select'){
      if(el.value==='__custom__'){
        const c=document.querySelector(`#f_fields [data-k="${f.key}_custom"]`);
        cfg[f.key]=c&&c.value.trim()?c.value.trim():'';
      }else{
        cfg[f.key]=el.value;
      }
      continue;
    }
    // password 型字段（如 token）：编辑时留空或仍为掩码值表示"不修改"，不覆盖旧值
    if(f.type==='password' && el.type==='password'){
      const v=el.value.trim();
      if(!v||isMasked(v))continue;
      cfg[f.key]=v;
      continue;
    }
    cfg[f.key]=f.type==='toggle'?el.checked:(el.value.trim());
  }
  return cfg;
}

// AutoClaw 验证码登录：无需粘贴任何凭证，手机收码即可建立/换新 30 天凭证

async function smsLogin(id){

async function toggleLog(id,btn){

    let sub='近30天签到记录';
    if(nRemote)sub+=` · <span style="color:#38bdf8">其中 ${nRemote} 天为本机未运行、由平台远端记录补回</span>`;
    if(r.hasRemoteApi&&!nRemote&&r.remoteError)sub+=` · <span style="color:#f59e0b">远端历史获取失败：${esc(r.remoteError)}</span>`;

    let html=`<div style="font-size:.7rem;color:#64748b;margin-bottom:4px">${sub}</div>`;
    html+='<div class=log-grid>';
    for(let i=29;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const p=n=>String(n).padStart(2,'0');
      const ds=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
      const log=logs.find(L=>L.date===ds);
      let cls='skip',v='·',tip=ds+' 未签到';
      if(log){
        if(log.source==='remote'){cls='remote';v='✓';tip=`${ds} 已签到（平台远端记录${log.sourceLabel?' · '+log.sourceLabel:''}${log.reward?' +'+log.reward:''}）`;}
        else {cls=log.status==='success'?'ok':log.status;v=log.status==='success'?'✓':(log.status==='invalid'?'!':'✗');tip=`${ds} ${log.status}（本机记录）${log.reward?' +'+log.reward:''}`;}
      }
      html+=`<div class="log-day ${cls}" title="${esc(tip)}"><span class=d>${p(d.getMonth()+1)}/${p(d.getDate())}</span><span class=v>${v}</span></div>`;
    }
    html+='</div>';
    html+='<div class=cal-legend style="margin-top:6px">图例 <i style="background:linear-gradient(135deg,#059669,#10b981)"></i>本机签到成功 <i style="background:linear-gradient(135deg,#0369a1,#0ea5e9)"></i>平台远端记录 <i style="background:rgba(239,68,68,.18);border:1px solid #ef4444"></i>失败 <i style="background:rgba(217,119,6,.18);border:1px solid #f59e0b"></i>凭证失效 <i style="background:#1e293b;border:1px solid #334155"></i>未签到</div>';
    block.innerHTML=html;
  }
}

function todayStr(offsetDays=0){
  const d=new Date(Date.now()+offsetDays*86400*1000);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function dateToSec(str){
  const d=new Date(str+'T00:00:00');
  return Math.floor(d.getTime()/1000);
}
/** 降级视图：provider 无会话级明细接口时，展示落库的逐日明细（同源真实端点，粒度到日） */
function renderDailyDetail(r,block,stVal,enVal){
  const bodyEl=block.querySelector('.u-body');
  const days=(r.days||[]).filter(d=>d.date>=stVal&&d.date<=enVal);
  const src=(r.sourceLabel||'')+(r.note?' · '+r.note:'');
  const noteHtml=r.note?'<br><span style="color:#f59e0b">'+esc(r.note)+'</span>':'';
  const head='<div style="font-size:.7rem;color:#64748b;margin-bottom:4px">'
    +(r.source==='remote'?'<svg class="ic"><use href="#h10i-satellite"></use></svg> 真实远端端点':'<svg class="ic"><use href="#h10i-file"></use></svg> 本地记录')+' · '+esc(r.sourceLabel||'—')+noteHtml+'</div>';
  if(!days.length){bodyEl.innerHTML=head+'<div class=usage-empty>该时段暂无消耗记录</div>';return;}
  const cred=days.reduce((s,d)=>s+(d.consumption||0),0);
  const tok=days.reduce((s,d)=>s+(d.tokens||0),0);
  let html=head+`<div class=usage-summ><span>天数 <b>${days.length}</b></span><span>共消耗 <b>${cred.toFixed(2)}</b> 分</span><span>共 <b>${Math.round(tok).toLocaleString()}</b> tok</span></div>`;
  for(const d of days){
    const ms=Object.entries(d.models||{}).map(([m,v])=>`${esc(m)} ${(v.consumption||0).toFixed(2)}`).join(' · ')||'—';
    html+=`<div class=usage-row>
      <span class=um>${esc(d.date)}</span>
      <span class=ut>${ms}</span>
      <span class=uc>${(d.consumption||0).toFixed(2)}分</span>
      <span class=up title="${esc(src)}"></span>
      <span class=usk>${d.tokens?Math.round(d.tokens).toLocaleString()+' tok':'—'}</span>
    </div>`;
  }
  const ml=(r.models||[]).map(m=>`${esc(m.model)}：${fmtVal(m.consumption)} 分 / ${m.tokens?Math.round(m.tokens).toLocaleString()+' tok':'—'}`).join('　');
  if(ml)html+=`<div style="font-size:.7rem;color:#94a3b8;margin-top:6px">模型累计：${ml}${r.modelsFromRange?' <span style="color:#64748b">（上游不提供逐日模型归属）</span>':''}</div>`;
  bodyEl.innerHTML=html;
}
async function loadUsage(id,block){
  const stI=block.querySelector('.u-start'),enI=block.querySelector('.u-end');
  const st=dateToSec(stI.value),en=dateToSec(enI.value)+86400-1;
  const bodyEl=block.querySelector('.u-body');
  bodyEl.innerHTML='<div style="font-size:.75rem;color:#64748b"><span class=loading></span> 查询中…</div>';
  const all=[];
  const pageSize=50;
  let pageNum=1,total=0;
  for(;;){
    const body=JSON.stringify({start_time:st,end_time:en,page_size:pageSize,page_num:pageNum,usage_type:[7]});
    const r=await api('/api/checkin/usage?id='+id,{method:'POST',headers:{'Content-Type':'application/json'},body});
    if(!r.ok){bodyEl.innerHTML='<div class=usage-empty>查询失败: '+(r.error||'未知错误')+'</div>';return;}
    // provider 无会话级接口 → 降级为落库逐日明细
    if(r.fallback==='daily'){renderDailyDetail(r,block,stI.value,enI.value);return;}
    const data=r.data||{};
    const list=data.user_usage_group_by_sessions||[];
    all.push(...list);
    total=data.total??list.length;
    if(all.length>=total||list.length<pageSize)break;
    pageNum++;
  }
  if(!all.length){bodyEl.innerHTML='<div class=usage-empty>该时段暂无积分消耗记录</div>';return;}
  const totalCred=all.reduce((s,x)=>s+(x.credits_float||0),0);
  let html=`<div class=usage-summ><span>会话 <b>${all.length}</b> 条</span><span>共消耗 <b>${totalCred.toFixed(2)}</b> 分</span></div>`;
  for(const x of all){
    const tok=x.extra_info||{};
    html+=`<div class=usage-row>
      <span class=um>${esc(x.model_name||'—')}</span>
      <span class=ut>${fmtTime((x.usage_time||0)*1000)}</span>
      <span class=uc>${(x.credits_float||0).toFixed(2)}分</span>
      <span class=up title="${esc(x.user_input_preview||'')}">${esc(x.user_input_preview||'')}</span>
      <span class=usk>${tok.input_token||0}/${tok.output_token||0} tok</span>
    </div>`;
  }
  bodyEl.innerHTML=html;
}

// ====== 消耗图表（每日柱状图 + 每日日历热力图，支持按 平台/账号/模型 筛选） ======
var barChart=null;
// 取当前账号/当前平台总 的每日序列，统一为 {date,total,models}
function chartSeries(accountId){
  if(!accountId){
    const t=viewTotal();
    return ((t&&t.byDate)||[]).map(d=>({date:d.date,total:d.consumption||0,tokens:d.tokens||0,models:d.models||{}}));
  }
  const acc=(stats.accounts||[]).find(a=>a.id===accountId);
  return (acc&&acc.days)?acc.days:[];
}
function collectModels(series){
  const set=new Set();
  for(const d of series)for(const m of Object.keys(d.models||{}))set.add(m);
  return [...set];
}
function dayVal(d,model){
  if(!d)return 0;
  if(!model)return isToken()?(d.tokens||0):(d.total!=null?d.total:(d.consumption||0));
  const m=d.models&&d.models[model];
  if(!m)return 0;
  return isToken()?(m.tokens||0):(m.consumption||0);
}
function renderBar(labels,data){
  const box=$('#chartBar');
  if(!barChart){
    box.innerHTML='<div style="font-size:.72rem;color:#94a3b8;margin-bottom:4px">每日消耗</div><div class=chart-box><canvas id=barCanvas></canvas></div>';
    barChart=new Chart(document.getElementById('barCanvas'),{
      type:'bar',
      data:{labels,datasets:[{label:'每日消耗',data,backgroundColor:'#38bdf8',borderRadius:2}]},
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>c.parsed.y.toFixed(2)+' '+unitSuffix()}}},
        scales:{
          y:{beginAtZero:true,grid:{color:'rgba(148,163,184,.12)'},ticks:{color:'#64748b',font:{size:10}}},
          x:{grid:{display:false},ticks:{color:'#94a3b8',font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:15}}
        }
      }
    });
  }else{
    barChart.data.labels=labels;
    barChart.data.datasets[0].data=data;
    barChart.update();
  }
}
// 每月消耗序列（当前平台总/账号），统一为 {month,total,tokens,models}
function monthSeries(accountId){
  if(!accountId){
    const t=viewTotal();
    return ((t&&t.months)||[]).map(m=>({month:m.month,total:m.total||0,tokens:m.tokens||0,models:m.models||{}}));
  }
  const acc=(stats.accounts||[]).find(a=>a.id===accountId);
  if(!acc||!acc.days)return [];
  const agg={};
  for(const d of acc.days){
    const m=(d.date||'').slice(0,7);
    if(!m)continue;
    const t=agg[m]||(agg[m]={total:0,tokens:0,models:{}});
    t.total+=d.consumption||0;
    t.tokens+=d.tokens||0;
    for(const [model,v] of Object.entries(d.models||{})){
      const mm=t.models[model]||(t.models[model]={consumption:0,tokens:0});
      mm.consumption+=v.consumption||0;
      mm.tokens+=v.tokens||0;
    }
  }
  return Object.entries(agg).map(([month,t])=>({month,total:t.total,tokens:t.tokens,models:t.models})).sort((a,b)=>a.month<b.month?-1:1);
}
function monthVal(mm,model){
  if(!mm)return 0;
  if(!model)return isToken()?(mm.tokens||0):(mm.total||0);
  const v=mm.models&&mm.models[model];
  if(!v)return 0;
  return isToken()?(v.tokens||0):(v.consumption||0);
}
var monthChart=null;
function renderMonthBar(labels,data){

        }
      }
    });
  }else{
    monthChart.data.labels=labels;
    monthChart.data.datasets[0].data=data;
    monthChart.update();

}

      +'，故上图该平台的 Token 柱状图恒为 0 —— 这是「上游没有原始数据」，不是「消耗为 0」。切回「积分」可看该平台的真实消耗。'
    : '';
  $('#chartHint').innerHTML=(missTxt?`<div style="color:#fbbf24;margin-bottom:4px">${esc(missTxt)}</div>`:'')
    +'上方为每日消耗柱状图与每月消耗柱状图；下方日历颜色越深表示当日消耗越高。数据由「每日消耗统计」自动落库，缺失日期在访问本页时自动补齐；消耗明细来自各平台真实服务器端点（Trae 按会话、WorkBuddy 按请求、CodeArts 用量分析接口）。';
}
function heatColor(v,max){
  if(!v)return '#0b1120';
  const r=Math.min(1,v/max);
  if(r<=0.25)return '#1e3a5f';
  if(r<=0.5)return '#2563eb';
  if(r<=0.75)return '#38bdf8';
  return '#22d3ee';
}
function renderCalendar(dayMap,model){
  const now=new Date();
  const startY=now.getFullYear();
  const start=new Date(startY,5,1);
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const vals=[];
  for(let t=new Date(start);t<=end;t.setDate(t.getDate()+1)){
    vals.push(dayVal(dayMap[fmtLocal(t)],model));
  }
  const max=Math.max(...vals,1);
  const startDow=start.getDay(); // 0=周日
  const cols=Math.ceil((vals.length+startDow)/7);
  const dows=['日','一','二','三','四','五','六'];
  let html='<div style="font-size:.72rem;color:#94a3b8;margin-top:8px;margin-bottom:2px">每日日历</div><div class=cal-wrap><div class=cal>';
  html+='<div class=cal-col>'+dows.map(d=>`<div class=cal-dow>${d}</div>`).join('')+'</div>';
  for(let c=0;c<cols;c++){
    let cells='';
    for(let r=0;r<7;r++){
      const globalDay=c*7+r;
      if(globalDay<startDow||globalDay>=startDow+vals.length){cells+='<div class=cal-day></div>';continue;}
      const d=new Date(start);d.setDate(d.getDate()+(globalDay-startDow));
      const key=fmtLocal(d);
      const v=vals[globalDay-startDow];
      const title=key+' · '+(v>0?v.toFixed(2)+' '+unitSuffix():'无消耗');
      cells+=`<div class="cal-day ${v?'':'zero'}" style="background:${heatColor(v,max)}">${d.getDate()}<span class=cv>${title}</span></div>`;
    }
    html+=`<div class=cal-col>${cells}</div>`;
  }
  html+='</div>';
  html+=`<div class=cal-legend>少 <i style="background:#0b1120;border:1px solid #1e293b"></i><i style="background:#1e3a5f"></i><i style="background:#2563eb"></i><i style="background:#38bdf8"></i><i style="background:#22d3ee"></i> 多</div>`;
  html+='</div>';
  return html;
}
function fmtLocal(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

loadData();
</script>
