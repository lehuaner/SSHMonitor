



<html>
	<body>





<script language="javascript">
var count = 0;
var onloadcount = 0;
var sum = 2;

function logout(logoutUrl)
{
    var theDiv = document.createElement("div");
	theDiv.height = 0;
	theDiv.width = 0;
	theDiv.setAttribute("style","display:none");
	theDiv.innerHTML="<iframe id=iframe_"+count+" name=iframe_"+count+" height=0 width=0 />";
	document.body.appendChild(theDiv);
	
	var iframe = document.getElementById("iframe_"+count);
	var theForm = document.createElement("form");
	theDiv.appendChild(theForm);

	if (logoutUrl.includes("console/logout")) {
		theForm.method = "get";
	} else {
		theForm.method = "post";
	}
	theForm.action = logoutUrl;
	theForm.target = "iframe_"+count;
	theForm.submit();
	
	count++;
	if (iframe.attachEvent)
	{ 
		iframe.attachEvent("onload", function()
		{
         	onloadcount++;
			if(onloadcount == sum)
			{
			    window.location.href = "/authui/serviceLogin.action?service=https%3A%2F%2Fcodearts.huaweicloud.com%2Fportal%2Fsettings%2Fpersonal-usage%3Flocale%3Dzh-cn";
			}
		});
	}
	else
	{
        iframe.onload = function()
		{
			onloadcount++;
			if(onloadcount == sum)
			{
				window.location.href = "/authui/serviceLogin.action?service=https%3A%2F%2Fcodearts.huaweicloud.com%2Fportal%2Fsettings%2Fpersonal-usage%3Flocale%3Dzh-cn";
			}
		};
	}
 	setTimeout("timeout()",10000);
}
function timeout()
{
		onloadcount++;
		if(onloadcount == sum)
		{
			window.location.href = "/authui/serviceLogin.action?service=https%3A%2F%2Fcodearts.huaweicloud.com%2Fportal%2Fsettings%2Fpersonal-usage%3Flocale%3Dzh-cn";
		}
}

function redirect()
{
	window.location.href = "/authui/serviceLogin.action?service=https%3A%2F%2Fcodearts.huaweicloud.com%2Fportal%2Fsettings%2Fpersonal-usage%3Flocale%3Dzh-cn";
}

</script>

	</body>
</html>
