    function loadScript(src, isModule, callback) {
        var script = document.createElement('script');
        script.src = src;
        script.type = isModule ? 'module' : 'text/javascript';
        script.crossOrigin = 'anonymous';

        script.onreadystatechange = function() {
            if (this.readyState === 'loaded' || this.readyState === 'complete') {
                script.onreadystatechange = null;
                if (typeof callback === 'function') {
                    callback(null);
                }
            }
        };

                callback(null);
            }
        };

        script.onerror = function() {
            if (typeof callback === 'function') {
                callback(new Error('Failed to load script: ' + src));
            }
        };

        document.head.appendChild(script);

    function loadCSS(href, callback) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;

        document.head.appendChild(link);

    function isMobileAuthorizePage(queryParams, isMobile) {
        // 判断页面是否为移动端授权页面
        var isMobileDisplay = queryParams.display === 'mobile' || queryParams.display === 'touch';

        return (isMobileDisplay && isDeviceAbsent && isMobileDevice) || isDevicePage;

    function loadPureJsPage() {
        // 兼容最老的浏览器
        var url = window.location.href;
        var queryParams = getQueryParams(url);

        function isMobile(userAgent) {
            if (!userAgent || userAgent.trim() === "") return false;
            var mobileKeys = ["Android", "Mobile", "iPhone", "iPad"];
            for (var i = 0; i < mobileKeys.length; i++) {
                if (userAgent.toLowerCase().indexOf(mobileKeys[i].toLowerCase()) !== -1) {
                    return true;
                }
            }
            return false;
        }

        if (!isMobileAuthorizePage(queryParams, isMobile)) {
            window.oauth2ReportData({ message: "scene not match, load pure js static failed" }, 'healthCheck');
        }

        var urlJs = '/static_html/authorize-frontend-js/js-index.html?' + queryParamsToString(queryParams);
        var xhr = new XMLHttpRequest();

        xhr.open('GET', urlJs, true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                    if (typeof window.oauth2ReportData === 'function') {
                        window.oauth2ReportData({ message: "load pure js static" }, 'healthCheck');

                    document.body.innerHTML = xhr.responseText;

                    window.oauth2ReportData({ message: "fetch http status is " + xhr.status + ", not in [200, 300), load pure js static failed" }, 'healthCheck');
                }
            }

        xhr.send();

        function getQueryParams(url) {
            var queryParams = {};
            var queryString = url.indexOf('?') !== -1 ? url.split('?')[1] : '';
            var params = queryString.split('&');
            for (var i = 0; i < params.length; i++) {
                var param = params[i].split('=');
                if (param.length === 2) {
                    queryParams[decodeURIComponent(param[0])] = decodeURIComponent(param[1]);

        function queryParamsToString(queryParams) {

                    queryString += encodeURIComponent(key) + '=' + encodeURIComponent(queryParams[key]);

            return queryString;
        }

        function loadAssets() {
            var links = document.body.getElementsByTagName('link');
            for (var i = 0; i < links.length; i++) {
                var link = links[i];
                if (link.rel === 'stylesheet') {
                    var newLink = document.createElement('link');
                    newLink.rel = 'stylesheet';
                    newLink.href = link.href;
                    document.head.appendChild(newLink);

                document.body.style.visibility = 'visible';

            if (document.readyState === 'complete') {

                window.addEventListener("load", onLoadHandler);
            }
        }

        function executeInlineScript(scriptContent) {
            var scriptElement = document.createElement('script');
            scriptElement.textContent = scriptContent;
            document.head.appendChild(scriptElement);
        }
    }

    function loadStatic() {
        if (isVue3Supported()) {
