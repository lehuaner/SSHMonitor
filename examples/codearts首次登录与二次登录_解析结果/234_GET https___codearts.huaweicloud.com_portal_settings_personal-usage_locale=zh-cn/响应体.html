<script>var href = window.location.href;var indexHash = href.indexOf('#');if(indexHash !== -1) {    var indexQuery = href.indexOf('?');    if(indexQuery === -1) {        href = href.replace('#', '?cloud_route_state=');    } else if(indexHash < indexQuery) {        href = href.replace('#', '?cloud_route_state=');    } else {        href = href.replace('#','&cloud_route_state=');    }}var service = href.indexOf('?service');if(service !== -1) {        var targethref = decodeURIComponent(href.substr(service + 9));        var uri = new URL(targethref);        if(uri.protocol === window.location.protocol  && uri.host === window.location.host) {                href = targethref;        }}window.location.replace('https://auth.huaweicloud.com/authui/login?service=' + encodeURIComponent(href));</script>
