<!DOCTYPE html>
<html class="login-pf" lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="robots" content="noindex, nofollow">

            <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
            <meta name="HandheldFriendly" content="true"/>
    <title>Tencent Cloud CodeBuddy</title>
    <link rel="icon" href="/auth/resources/of3m6/login/phone/img/favicon.ico" />
            <link href="/auth/resources/of3m6/common/keycloak/vendor/patternfly-v4/patternfly.min.css" rel="stylesheet" />
            <link href="/auth/resources/of3m6/common/keycloak/vendor/patternfly-v3/css/patternfly.min.css" rel="stylesheet" />

            <link href="/auth/resources/of3m6/common/keycloak/lib/pficon/pficon.css" rel="stylesheet" />
            <link href="/auth/resources/of3m6/login/phone/css/login.css" rel="stylesheet" />
            <link href="/auth/resources/of3m6/login/phone/css/styles.v421.css" rel="stylesheet" />
    <link rel="stylesheet" href="/auth/resources/of3m6/login/phone/css/oauth.v2.css">
    <script type="importmap">
        {
            "imports": {
                "rfc4648": "/auth/resources/of3m6/common/keycloak/node_modules/rfc4648/lib/rfc4648.js"
            }
        }
    </script>
    <script src="/auth/resources/of3m6/login/phone/js/menu-button-links.js" type="module"></script>
        <script src="/auth/resources/of3m6/login/phone/js/axios.min.js"></script>
        <script src="/auth/resources/of3m6/login/phone/js/vue.min.js"></script>
    <script src="/auth/resources/of3m6/login/phone/js/main.v421.js"></script>

    <script type="module">
        import { checkCookiesAndSetTimer } from "/auth/resources/of3m6/login/phone/js/authChecker.js";

        checkCookiesAndSetTimer(
          "/auth/realms/copilot/login-actions/restart?client_id=account&tab_id=95-7Xckq2HI&skip_logout=true"
        );
    </script>
    <style>
        [v-cloak] > * {
            display: none;
        }

        [v-cloak]::before {
            content: "loading...";
        }
    </style>
</head>
<body class="common-body  ">
        <div id="vue-app" style="height:100%">
            <div v-cloak style="height:100%">
                <div class="login-pf-page" id="loginwrapper">
                    <div id="kc-header" class="login-pf-page-header">
                        <div v-if="isUltimate" id="kc-header-box"
                            class="kc-standard-logo">copilot</div>
                        <div v-else id="kc-header-box" class="kc-enter-logo">
                            <img :src="productInfo.productIcon" alt="">
                            <span>{{ productInfo.productName }}</span>
                        </div>
                    </div>
                    <div class="card-pf">
                        <div id="kc-content">
                            <div id="kc-content-wrapper">
        <div id="kc-logout-confirm" class="content-area">
            <p class="instruction">您确定要注销吗？</p>

            <form class="form-actions" action="/auth/realms/copilot/protocol/openid-connect/logout/logout-confirm?client_id=account&amp;tab_id=95-7Xckq2HI" onsubmit="confirmLogout.disabled = true; return true;" method="POST">
                <input type="hidden" name="session_code" value="8RA0F0svQtexQ4adyUF9H2mw9rFkmcMjPbq1oB5vIV8">
                <div class="form-group">
                    <div id="kc-form-options">
                        <div class="">
                        </div>
                    </div>

                    <div id="kc-form-buttons" class="form-group">
                        <input tabindex="4"
                               class="pf-c-button pf-m-primary pf-m-block btn-lg"
                               name="confirmLogout" id="kc-logout" type="submit" value="注销"/>
                    </div>

                </div>
            </form>

            <div id="kc-info-message">
            </div>

            <div class="clearfix"></div>
        </div>


                            </div>
                        </div>
                        <div class="kc-form-tips" v-if="!isEnterprisePrivate">
                            <span>登录即表示您同意我们的</span>
                            <a href="https://cloud.tencent.com/document/product/301/106125" target="_blank">《服务条款》</a>和<a href="https://privacy.qq.com/document/preview/284d799a07164d09bfc7cedd0ec3e089" target="_blank">《隐私协议》</a>
                        </div>
                    </div>
                    <div id="kc-footer" v-if="!isEnterprisePrivate">
                        <footer id="kc-footer-wrapper">
                            <span>Copyright © 1998 - 2024 Tencent. All Rights Reserved. 腾讯公司 版权所有</span>
                            <a href="https://cloud.tencent.com/document/product/301/106125" target="_blank">服务协议</a> |
                            <a href="https://privacy.qq.com/document/preview/284d799a07164d09bfc7cedd0ec3e089" target="_blank">隐私政策</a> |
                            <a href="http://beian.miit.gov.cn/" target="_blank">粤B2-20090059</a> |
                            <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44030002000001" target="_blank">粤公网安备 44030002000001号</a>
                        </footer>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            function req(phoneNumber) {
                const params = {params: {phoneNumber}}
                axios.get(window.location.origin + '/auth/realms/copilot/sms/authentication-code', params)
                    .then(res => {
                        app.disableSend(res.data.expires_in);
                    })
                    .catch(e => {
                        app.errorMessage = e.response.data.error;
                        const phoneNumber = document.getElementById('phoneNumber');
                        phoneNumber.setAttribute("aria-invalid", "true");
                    });
            }

            function injectEnvDot() {
                const cleRouteScript = document.createElement('script');
                cleRouteScript.async = true;
                cleRouteScript.type = 'text/javascript';
                cleRouteScript.src = 'https://mirrors.tencent.com/repository/generic/cle-env-switch/latest/cle-switch.min.js';
                document.head.appendChild(cleRouteScript);
            };

            function getEnterpriseInfo () {
                const enterpriseId = app_edition === 'enterprisePrivate' ? 'copilot' : hostname.split('.')[0];
                axios.get('/console/exclusive/enterprises/' + enterpriseId + '/loginInfo')
                    .then(res => {
                        const { enterpriseName, enterpriseQrCode, product } = res?.data?.data || {};
                        app.enterpriseName = enterpriseName;
                        app.enterpriseQrCode = enterpriseQrCode;
                        const { productName, productIcon } = product || {};
                        const defaultIcon = app_edition === 'enterprisePrivate' ? '/auth/resources/of3m6/login/phone/img/logo-enter.svg' : '/auth/resources/of3m6/login/phone/img/logo.png';
                        app.productInfo.productName = productName || DEFAULT_PRODUCT_NAME;
                        app.productInfo.productIcon = productIcon || defaultIcon;
                        if (productName) {
                            document.title = productName;
                        }
                        if (productIcon) {
                            const link = document.querySelector("link[rel='icon']");
                            link.href = productIcon;
                        }
                    })
                    .catch(e => {
                        console.log('get enterprise info error', e);
                    })
            };

            var app = new Vue({
                el: '#vue-app',
                data: {
                    isEnterprisePrivate: app_edition === 'enterprisePrivate',
                    // 登录页面
                    errorMessage: '',
                    freezeSendCodeSeconds: 0,
                    phoneActivated: isStandard, // 公域使用手机号登录
                    areaCode: (function() {
                        const attempted = '';
                        if (attempted.startsWith('+852')) return '+852';
                        if (attempted.startsWith('+853')) return '+853';
                        return '+86';
                    })(),
                    areaCodeOpen: false,
                    areaCodes: [
                        { name: '中国大陆', code: '+86' },
                        { name: '中国香港', code: '+852' },
                        // { name: '中国澳门', code: '+853' }, // 暂时屏蔽，下一期支持
                    ],
                    phoneNumber: (function() {
                        const attempted = '';
                        // 如果回填的手机号已包含区号前缀，去掉区号只保留纯手机号
                        const codes = ['+86', '+852', '+853'];
                        for (const code of codes) {
                            if (attempted.startsWith(code)) {
                                return attempted.slice(code.length);
                            }
                        }
                        return attempted;
                    })(),
                    authCode: '',
                    phoneInvalid: '',
                    codeInvalid: '',
                    sendButtonText: '获取验证码',
                    initSendButtonText: '获取验证码',
                    formTitle: '欢迎使用 Tencent Cloud CodeBuddy',
                    enterpriseName: '',
                    enterpriseQrCode: null,
                    productInfo: {},
                    username: '',
                    password: '',
                    submitDisable: true,
                    accountDisable: false,
                    providerMap: {},
                    // 重置密码页面
                    newPassword: '',
                    confirmPassword: '',
                    resetSubmitDisable: true,
                },
                methods: {
                    toggleAreaCode: function() {
                        app.areaCodeOpen = !app.areaCodeOpen;
                    },
                    selectAreaCode: function(code) {
                        app.areaCode = code;
                        app.areaCodeOpen = false;
                    },
                    disableSend: function(seconds) {
                        if (seconds <= 0) {
                            app.sendButtonText = app.initSendButtonText;
                        } else {
                            const minutes = Math.floor(seconds / 60) + '';
                            const seconds_ = seconds % 60 + '';
                            app.sendButtonText = String(minutes.padStart(2, '0') + ":" + seconds_.padStart(2, '0'));
                            setTimeout(function () {
                                app.disableSend(seconds - 1);
                            }, 1000);
                        }
                    },
                    sendVerificationCode: function() {
                        const phoneNumber = app.phoneNumber;
                        const areaCode = app.areaCode;
                        const cnReg = /^1[3-9]\d{9}$/;
                        const hkReg = /^[456789]\d{7}$/;
                        const moReg = /^6\d{7}$/;
                        app.codeInvalid = '';
                        let valid = false;
                        if (areaCode === '+86') valid = cnReg.test(phoneNumber);
                        else if (areaCode === '+852') valid = hkReg.test(phoneNumber);
                        else if (areaCode === '+853') valid = moReg.test(phoneNumber);
                        if (!phoneNumber || !valid) {
                            this.errorMessage = !phoneNumber ? '请填写手机号码.' : '无效的电话号码';
                            app.phoneInvalid = 'true';
                            return;
                        }
                        if (this.sendButtonText !== this.initSendButtonText) {
                            return;
                        }
                        req(areaCode + phoneNumber);
                    },
                    inputChange: function() {
                        if (app.phoneActivated) {
                            if (app.phoneNumber) {
                                app.errorMessage = '';
                                app.phoneInvalid = '';
                                app.codeInvalid = '';
                            }
                            if (app.phoneNumber && app.authCode) {
                                app.submitDisable = false;
                            } else {
                                app.submitDisable = true;
                            }
                        } else {
                            if (app.username && app.password) {
                                app.submitDisable = false;
                            } else {
                                app.submitDisable = true;
                            }
                        }
                    },
                    resetInputChange: function() {
                        if (app.newPassword && app.confirmPassword) {
                            app.resetSubmitDisable = false;
                        } else {
                            app.resetSubmitDisable = true;
                        }
                    },
                },
                mounted: () => {
                    document.addEventListener('click', function(e) {
                        const selector = document.querySelector('.kc-country-selector');
                        const dropdown = document.querySelector('.kc-country-dropdown');
                        if (selector && dropdown && !selector.contains(e.target) && !dropdown.contains(e.target)) {
                            app.areaCodeOpen = false;
                        }
                    });
                    if (!isUltimate) {
                        getEnterpriseInfo();
                        if (switchEnv !== null && switchEnv !== '0') {
                            localStorage.setItem('switchEnv', 'true');
                        } else if (switchEnv === '0') {
                            localStorage.removeItem('switchEnv');
                        }
                        if (localStorage.getItem('switchEnv') === 'true') {
                            injectEnvDot();
                        }
                    }
                },
            });
        </script>
        <script type="text/javascript">
            if (window.top !== window) {
                let theme = window.parent && window.parent.document.documentElement.offsetWidth > 460 ? 'kc-iframe-large' : 'kc-iframe-small';
                document.getElementById('loginwrapper').className += ' ' + theme;
            }
        </script>
</body>
</html>
