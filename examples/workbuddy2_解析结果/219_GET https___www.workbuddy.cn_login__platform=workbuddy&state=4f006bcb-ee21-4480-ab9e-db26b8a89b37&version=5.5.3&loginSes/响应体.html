  <!--
      微信内网员工探测（新版·前置）：在 React bundle 加载前就在 HTML 内联执行，尽早决策，缩短白屏。
      仅微信环境 + 预发启用；纯裸 fetch，不依赖项目 axios 封装。旧版探测（React 内 checkOAEnv + wechatOauth）
      保持不变，用于非微信环境/兜底。

      两态：
        1. 首次进入：直接 location.replace 跳微信 snsapi_base 授权（redirect_uri 回本页带 wx_staff_code=1）。
        2. 回跳态（wx_staff_code=1&code）：裸 fetch /console/wx/check-staff 判员工；命中则写 sessionStorage
           标记（React挂载后读取并展示 iOA 入口），随后清掉 URL 上的探测参数、正常渲染登录页。
      死循环防护：sessionStorage 记时间戳，60s 内不重复发起。
    -->
  <script>
    (function () {
      try {
        var ua = navigator.userAgent.toLowerCase();
        var isWeixin = ua.indexOf('micromessenger') !== -1 && ua.indexOf('wxwork') === -1;
        if (!isWeixin) { return; }

        // ⚠️【微信内网员工探测 · 总开关 · 后期统一删除入口（index.html 侧）】⚠️
        // 已全量放开，所有环境生效。此内联脚本在 bundle 之外、无法 import，
        // 故此处判断与 React 侧 utils/helper.ts 的 isWxStaffDetectEnabled() 等价、需保持一致；
        // 下线时两处（本函数 + helper.ts）一并删除。
        var isWxStaffDetectEnabled = function () {
          return true;
        };
        if (!isWxStaffDetectEnabled()) { return; }

        // 微信公众号 AppId 按环境区分：现网(prod) 与预发/开发各用各自后台配了网页授权域名的 AppId，
        // 用错任一侧都会被微信判为「redirect_uri 参数错误」。此内联脚本在 bundle 之外无法 import，
        // 用更早注入的 window.RUN_ENV（占位符替换）判断：仅 'prod' 用现网 AppId，其余一律用预发 AppId。
        var WX_APPID_PROD = 'wxf3055eea2dff6d9c';
        var WX_APPID_STAGING = 'wx62eea88688369ded';
        var WX_APPID = window.RUN_ENV === 'prod' ? WX_APPID_PROD : WX_APPID_STAGING;
        var FLAG = 'wx_staff_code';
        var STARTED_KEY = 'wx_staff_oauth_started';
        var IOA_HIT_KEY = 'wx_staff_ioa_hit';
        var IOA_HIT_EVENT = 'wx-staff-ioa-hit';
        var TTL_MS = 60 * 1000;

        var params = new URLSearchParams(window.location.search);
        // 回跳态：拿 code 判员工。
        if (params.get(FLAG) === '1') {
          // code 先取进闭包变量，随后【同步】清 URL —— 不能等 fetch 回来再清：
          // 探测 fetch 与 React bundle 加载是并行的，若 URL 上还留着 code，
          // newLogin 的 init() 会用 has('code') 把这次访问误判成 OIDC 回调
          // （污染 aegis span 名，且 embed=iframe 嵌套场景下会去 reload 最外层 login iframe）。
          var code = params.get('code');
          try { sessionStorage.removeItem(STARTED_KEY); } catch (e) { }
          // 清 URL：只删探测标记(wx_staff_code) 和微信回跳追加的 code；state 一律不动。
          // 首次进入时 redirect_uri 完整保留了原始业务 state，且微信 authorize 未再传探测 state
          // （见下方首次进入分支），故回跳 URL 上不会出现第二个 state，这里直接保留即可。
          var p = new URLSearchParams(window.location.search);
          p.delete(FLAG); p.delete('code');
          var q = p.toString();
          var newUrl = window.location.pathname + (q ? '?' + q : '') + window.location.hash;
          window.history.replaceState(null, '', newUrl);
          if (!code) { return; }
          // 裸 fetch 判员工；同域相对路径。命中写 sessionStorage 供React 读取。
          fetch('/console/wx/check-staff', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code }),
            credentials: 'include',
          })
            .then(function (r) { return r.json(); })
            .then(function (json) {
              var data = (json && (json.data || json)) || {};
              if (data.isStaff) {
                // 先写 sessionStorage 再派事件，两条路径覆盖"回包早于/晚于 React 挂载"两种顺序：
                // 挂载早于回包时组件读不到 sessionStorage，只能靠这个事件通知（组件消费后会清掉标记）。
                try { sessionStorage.setItem(IOA_HIT_KEY, '1'); } catch (e) { }
                try { window.dispatchEvent(new Event(IOA_HIT_EVENT)); } catch (e) { }
              }
            })
            .catch(function () { /* 判定失败静默降级，走默认登录 */ });
          return;
        }

        // OIDC 登录中（带这些参数）：不干扰，交给 React。
        if (params.get('mp_login_code') || params.get('kc_idp_hint') || params.get('code')) { return; }

        // 死循环防护：60s 内已发起过则不再跳。
        var startedRaw = null;
        try { startedRaw = sessionStorage.getItem(STARTED_KEY); } catch (e) { }
        if (startedRaw) {
          var startedAt = Number(startedRaw);
          if (isFinite(startedAt) && Date.now() - startedAt < TTL_MS) { return; }
        }

        // 首次进入：直接跳微信授权，回跳本页。
        // 回跳 redirect_uri = 原始 URL 的全部 query（含业务 platform / redirect_uri / state）+ 新增 wx_staff_code=1，
        // 完整保留登录上下文 —— 否则微信授权来回 302 后 platform / redirect_uri / state 会丢失，导致登录成功后
        // 无法跳回原 website/workbuddy 页面（一直转圈），且 platform 为空使审计日志接口报 400。
        // 不给微信 authorize 传 state：本探测的 state 全程无人校验（后端 /wx/check-staff 只认 code，
        // 前端也不校验回跳 state），传了反而会被微信原样回传、在回跳 URL 上叠出第二个 state 参数，
        // 干扰原始业务 state。故这里刻意省略 state，从源头保证回跳 URL 只有原始业务 state 一个。
        var backParams = new URLSearchParams(window.location.search);
        backParams.set('wx_staff_code', '1');
        var redirectUri = window.location.origin + '/login/?' + backParams.toString();
        var authorizeUrl = 'https://open.weixin.qq.com/connect/oauth2/authorize?' +
          new URLSearchParams({
            appid: WX_APPID,
            redirect_uri: redirectUri,
            response_type: 'code',
            scope: 'snsapi_base',
          }).toString() + '#wechat_redirect';
        try { sessionStorage.setItem(STARTED_KEY, String(Date.now())); } catch (e) { }
        window.location.replace(authorizeUrl);
      } catch (e) {
        /* 任何异常都不阻断，交给 React 版探测/默认登录 */
      }
    })();
  </script>
